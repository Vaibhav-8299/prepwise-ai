<div class="upload-container">
  <div class="header">
    <h1>Resume Analyzer ✨</h1>
    <p>Upload your resume and enter a target role. Our AI will analyze your fit and suggest improvements.</p>
  </div>

  <div class="form-group">
    <label for="role">Target Role</label>
    <input 
      type="text" 
      id="role" 
      [(ngModel)]="targetRole" 
      placeholder="e.g. Frontend Developer, Data Scientist"
      [disabled]="isUploading"
    >
  </div>

  <div 
    class="drop-zone" 
    [class.dragging]="isDragging"
    [class.has-file]="selectedFile"
    (dragover)="onDragOver($event)" 
    (dragleave)="onDragLeave($event)" 
    (drop)="onDrop($event)"
  >
    <div class="drop-content" *ngIf="!selectedFile">
      <div class="icon">📄</div>
      <h3>Drag & Drop your resume here</h3>
      <p>or</p>
      <button class="browse-btn" (click)="fileInput.click()" [disabled]="isUploading">Browse Files</button>
      <input 
        type="file" 
        #fileInput 
        (change)="onFileSelected($event)" 
        accept=".pdf" 
        style="display: none;"
      >
      <p class="hint">PDF only, max 5MB</p>
    </div>

    <div class="file-info" *ngIf="selectedFile">
      <div class="file-icon">📝</div>
      <div class="file-details">
        <span class="file-name">{{ selectedFile.name }}</span>
        <span class="file-size">{{ (selectedFile.size / 1024 / 1024).toFixed(2) }} MB</span>
      </div>
      <button class="remove-btn" (click)="removeFile()" [disabled]="isUploading">✕</button>
    </div>
  </div>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <button 
    class="analyze-btn" 
    (click)="upload()" 
    [disabled]="!selectedFile || !targetRole || isUploading"
  >
    <span *ngIf="!isUploading">Analyze Resume</span>
    <span *ngIf="isUploading" class="loader"></span>
    <span *ngIf="isUploading">Analyzing with Gemini AI...</span>
  </button>
</div>
